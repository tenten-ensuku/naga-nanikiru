[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[agents.luna]
description = "Luna is SOL's focused implementation subagent for bounded coding, investigation, testing, and data tasks."
config_file = "./agents/luna.toml"
