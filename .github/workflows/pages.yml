name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # These checks use local fixtures, never production Supabase or R2.
      - run: npm run test:ops
      - run: npm run test:drill
      - run: npm run test:mobile
      - run: npm run test:navigation
      - run: npm run test:builder
      - run: npm run test:startup
      - run: npm run test:meld
      - run: npm run test:media
      - run: npm run test:offline
      - run: npm run build:supabase-client
      # Pages remains a static entrance; authentication and study use the Worker.
      - run: node --test tests/cloudflare-*.test.mjs
      - run: node scripts/prepare-cloudflare-entry.mjs --output-dir public --mode ci
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
